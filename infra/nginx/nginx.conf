# Edge reverse proxy. Terminates TLS for every external connection; routes
# /api and /ws to the Fastify backend and everything else to the SPA.

# The access log records paths without their query string. WebSocket tickets (?ticket=) and OAuth
# codes (?code=&state=) travel there; both are single use, but a log file is no place to keep them.
# The API's own log strips them the same way. The referrer is cut at its '?' for the same reason.
map $http_referer $referer_path {
    "~^(?<path>[^?#]*)" $path;
    default             "";
}
log_format wkb '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
               '$status $body_bytes_sent "$referer_path" "$http_user_agent"';

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/wkb.crt;
    ssl_certificate_key /etc/nginx/certs/wkb.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Someone typing http://host:8443 gets bounced to https instead of nginx's raw "plain HTTP request sent to HTTPS port" error.
    # $http_host keeps the port the browser used; $server_port would give the container's 443.
    error_page 497 https://$http_host$request_uri;

    client_max_body_size 4m;

    server_tokens off;

    access_log /var/log/nginx/access.log wkb;

    add_header X-Content-Type-Options    "nosniff"        always;
    add_header X-Frame-Options           "DENY"           always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Referrer-Policy           "same-origin"    always;
    # max-age=0 on purpose: the certificate is self-signed, and a browser told to insist on HTTPS for this host
    # would stop offering the "proceed anyway" button. With a real certificate, use "max-age=31536000; includeSubDomains".
    add_header Strict-Transport-Security "max-age=0" always;

    #WebSocket channels: /ws/lobby and /ws/room
    location /ws/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $http_host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }
    location = /50x.html {
        root /etc/nginx/error;
        internal;
    }

    location @api_unavailable {
        default_type application/json;
        return 503 '{"error":{"code":"error.serviceUnavailable"}}';
    }
    #REST API
    location /api/ {
        error_page 502 503 504 = @api_unavailable;

        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $http_host;
    }
    #SPA
    location / {
        error_page 502 503 504 /50x.html;
        proxy_pass http://web:80;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
