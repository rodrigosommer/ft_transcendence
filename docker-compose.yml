# Four services on one dedicated bridge network. TLS is terminated at the nginx edge; 
# Traffic between containers is plain HTTP, which the subject explicitly allows.

name: wkb

services:
  postgres:
    image: postgres:16-alpine
    container_name: wkb_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - wkb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: wkb_api
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      API_PORT: ${API_PORT:-3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: ${DATABASE_URL}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN}
      PUBLIC_ORIGIN_ALIASES: ${PUBLIC_ORIGIN_ALIASES:-}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-900}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-2592000}
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      FT_CLIENT_ID: ${FT_CLIENT_ID:-}
      FT_CLIENT_SECRET: ${FT_CLIENT_SECRET:-}
    volumes:
      - uploads:/app/apps/api/uploads
    networks:
      - wkb
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+(process.env.API_PORT||3000)+'/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: wkb_web
    restart: unless-stopped
    networks:
      - wkb
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

  nginx:
    image: nginx:1.27-alpine
    container_name: wkb_nginx
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8443}:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/50x.html:/etc/nginx/error/50x.html:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    networks:
      - wkb
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started

networks:
  wkb:
    driver: bridge

volumes:
  pgdata:
  uploads:
